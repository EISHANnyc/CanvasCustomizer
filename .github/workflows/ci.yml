name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Manifest & JSON syntax
        run: |
          node -e "
            const fs = require('fs');
            const mf = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (!mf.name || !mf.version || mf.manifest_version !== 3) {
              throw new Error('Invalid manifest.json schema');
            }
            console.log('Manifest OK - Version:', mf.version);
          "

      - name: Syntax Check JavaScript
        run: |
          node -c content/theme-engine.js
          node -c popup/popup.js
          node -c shared/presets.js
          node -c shared/canvas-styles.js

      - name: Run Extension Validation Suite
        run: |
          node tests/validate-extension.js
